<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>BrewGo</title>
<meta name="description" content="Small-batch cold brew, steeped 18 hours and delivered cold. A demo storefront for a course project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Bố cục: băng chuyền "thời gian và nhiệt độ". Nền xanh sương lạnh, chữ nâu espresso, chai thuỷ tinh vẽ bằng SVG.
   Điểm nhấn: mặt đồng hồ 24 giờ với cung 18 giờ ủ lạnh ở hero. Màu tương tác dùng xanh lạnh, màu caramel chỉ để trang trí. */
:root{
  --bg:#EAF1F5; --paper:#FFFFFF; --ink:#1D130F; --muted:#4F5C67; --line:#D0DCE3;
  --brand:#0B6E99; --brand-ink:#FFFFFF; --brand-soft:#DDEFF7;
  --caramel:#C9782B; --disc:#D3E7F1;
  --tint-original:#DCEBF3; --tint-sweet:#F1E3D3; --tint-oat:#E2EBDA; --tint-coconut:#D6EEEC;
  --ice-fill:#FFFFFF; --ice-stroke:#FFFFFF; --ice-o:.5;
  --ok:#0B7A55; --bad:#BE2338;
  --lift:0 1px 0 rgb(29 19 15 / .05),0 18px 40px -18px rgb(29 19 15 / .35);
  --f-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1216; --paper:#121B21; --ink:#EDF3F6; --muted:#9DAEB8; --line:#24353F;
    --brand:#6CC3EC; --brand-ink:#04222F; --brand-soft:#11303D;
    --caramel:#E79A48; --disc:#15303C;
    --tint-original:#14303C; --tint-sweet:#2E2318; --tint-oat:#1F2B1C; --tint-coconut:#102E2C;
    --ice-fill:#BFE4F5; --ice-stroke:#BFE4F5; --ice-o:.22;
    --ok:#4BD6A0; --bad:#FF8190;
    --lift:0 1px 0 rgb(0 0 0 / .4),0 18px 40px -18px rgb(0 0 0 / .8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1216; --paper:#121B21; --ink:#EDF3F6; --muted:#9DAEB8; --line:#24353F;
  --brand:#6CC3EC; --brand-ink:#04222F; --brand-soft:#11303D;
  --caramel:#E79A48; --disc:#15303C;
  --tint-original:#14303C; --tint-sweet:#2E2318; --tint-oat:#1F2B1C; --tint-coconut:#102E2C;
  --ice-fill:#BFE4F5; --ice-stroke:#BFE4F5; --ice-o:.22;
  --ok:#4BD6A0; --bad:#FF8190;
  --lift:0 1px 0 rgb(0 0 0 / .4),0 18px 40px -18px rgb(0 0 0 / .8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,p,ul,ol,dl,dd,figure,address{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
:lang(vi) h1,:lang(vi) h2,:lang(vi) h3{line-height:1.16}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:8px}
.skip:focus{left:8px;z-index:100;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:999px}
.eyebrow,.cap,.lg{font:500 .75rem/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-wrap:balance}
.lg{display:block;margin-bottom:10px}
.lg.flush{margin:0}
.muted{color:var(--muted)}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.7rem 1.5rem;border:1.5px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none;transition:background-color .15s,color .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.invert{background:var(--bg);border-color:var(--bg);color:var(--ink)}
.btn.invert:hover:not(:disabled){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.block{width:100%}
.link{border:0;background:none;padding:6px 0;font-weight:600;color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.link:disabled{opacity:.45;text-decoration:none}
.link.center{display:block;margin:6px auto 0}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--line);border-radius:50%;background:transparent}
.icon-btn:hover{border-color:var(--ink)}

/* đầu trang */
.demo{background:var(--ink);color:var(--bg);font:500 .72rem/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.demo .wrap{padding-block:7px;text-align:center}
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:68px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:800 1.6rem/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.mark{width:32px;height:32px}
.nav{display:flex;gap:26px;margin-left:auto}
.nav a{padding:8px 0;border-bottom:2px solid transparent;font-weight:500;text-decoration:none}
.nav a:hover{border-bottom-color:var(--brand)}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{min-width:42px;min-height:38px;border:0;background:transparent;font:500 .8rem/1 var(--f-mono)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline-offset:-3px}
.cart-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;font-weight:600}
.cart-btn:hover{background:var(--brand-soft)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--caramel);color:#1D130F;font:600 .72rem/22px var(--f-mono);text-align:center}
.badge.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.35)}}
.menu-btn{display:none}
.nav .lang{display:none}

/* hero */
.hero{padding-block:clamp(28px,5vw,64px) clamp(36px,6vw,80px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.hero h1{margin:14px 0 20px;font-size:clamp(2.6rem,5.5vw,4.4rem);font-weight:800;line-height:1}
:lang(vi) .hero h1{line-height:1.1}
.hero h1 .hl{display:block;color:var(--brand)}
.hero .sub{max-width:32em;color:var(--muted);font-size:clamp(1.05rem,.6rem + 1.4vw,1.25rem)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.facts{display:flex;flex-wrap:wrap;gap:14px 36px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.facts li{display:flex;flex-direction:column;gap:2px}
.facts b{font:700 2.2rem/1 var(--f-display);letter-spacing:.01em}
.facts span{font:500 .72rem/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero-art{width:100%;max-width:620px;justify-self:center}
.hero-art svg{display:block;width:100%;height:auto;overflow:visible}
.hero-art .disc{fill:var(--disc)}
.hero-art .ring{fill:none;stroke:var(--line);stroke-width:1.5}
.hero-art .arc{fill:none;stroke:var(--brand);stroke-width:5;stroke-linecap:round}
.hero-art .tk line{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.hero-art .tl{font:500 13px var(--f-mono);fill:var(--muted)}
.hero-art .dot{fill:var(--brand);stroke:var(--bg);stroke-width:3}
.ice{fill:var(--ice-fill);fill-opacity:var(--ice-o);stroke:var(--ice-stroke);stroke-opacity:.8;stroke-width:1.5}
.ice-hi{fill:#fff;fill-opacity:.6}
.bean{fill:#2A1812}
.bean-l{fill:none;stroke:#0D0806;stroke-width:1.6;stroke-linecap:round}
.bt{display:block;overflow:visible}
.bt-b{font:500 7px var(--f-mono);letter-spacing:.18em;fill:#1D130F}
.bt-n{font-family:var(--f-display);font-weight:800;fill:#1D130F}
.bt-s{font:500 5.2px var(--f-mono);letter-spacing:.1em;fill:#4F5C67}

.usp{border-block:1px solid var(--line)}
.usp ul{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.usp li{padding:18px 20px;border-left:1px solid var(--line)}
.usp li:first-child{border-left:0;padding-left:0}
.usp .v{display:block;margin-top:4px;font:700 1.35rem/1.15 var(--f-display);letter-spacing:.01em;text-transform:uppercase}

/* khối nội dung */
.sec{padding-block:clamp(56px,8vw,104px)}
.sec.alt{background:var(--paper);border-block:1px solid var(--line)}
section[id]{scroll-margin-top:80px}
.sec-head{max-width:46rem;margin-bottom:clamp(24px,4vw,40px)}
.sec-head h2{margin-top:10px;font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800}
.sec-head .lead{max-width:38em;margin-top:14px;color:var(--muted);font-size:1.0625rem}

/* chip và pill */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;flex:1 1 150px;min-width:0}
.chip input,.pill input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip .box{display:flex;flex-direction:column;gap:2px;height:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);transition:border-color .15s,background-color .15s}
.chip .box b{font-weight:600;line-height:1.35}
.chip .box small{font:400 .75rem/1.4 var(--f-mono);color:var(--muted)}
.chip:hover .box{border-color:var(--muted)}
.chip input:checked+.box{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.chip input:focus-visible+.box,.pill input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pill{position:relative}
.pill span{display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);font-weight:500;transition:background-color .15s,color .15s,border-color .15s}
.pill:hover span{border-color:var(--ink)}
.pill input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* sản phẩm */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.pcard{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--paper)}
.pmedia{position:relative;display:flex;align-items:flex-end;justify-content:center;height:300px;padding:52px 0 12px;background:var(--tint-original)}
.pcard[data-sku="sweet"] .pmedia,.t-sweet{background:var(--tint-sweet)}
.pcard[data-sku="oat"] .pmedia,.t-oat{background:var(--tint-oat)}
.pcard[data-sku="coconut"] .pmedia,.t-coconut{background:var(--tint-coconut)}
.t-original{background:var(--tint-original)}
.pmedia .bt{height:100%;width:auto;transition:transform .3s ease}
.pcard:hover .pmedia .bt{transform:translateY(-6px)}
.ptag{position:absolute;top:14px;left:14px;padding:4px 10px;border-radius:999px;background:var(--paper);font:500 .68rem/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.pbody{display:flex;flex:1;flex-direction:column;gap:10px;padding:18px}
.prow{display:flex;flex-direction:column;gap:2px}
.prow h3{font-size:1.65rem;font-weight:800}
.pprice{font:500 1rem/1.2 var(--f-mono);white-space:nowrap}
.ptype{font:500 .75rem/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.pdesc{color:var(--muted);font-size:.9375rem}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.notes li{padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:.78rem}
.pact{margin-top:auto;padding-top:8px}
.pact .btn,.pact .stepper{width:100%}
.pdet{border-top:1px solid var(--line);padding-top:10px;font-size:.85rem}
.pdet summary{cursor:pointer;font-weight:600;color:var(--muted)}
.pdet p{margin-top:8px;color:var(--muted)}
.pnudge{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:28px;padding:16px 20px;border-radius:20px;background:var(--brand-soft)}

.stepper{display:inline-flex;align-items:center;justify-content:space-between;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper)}
.stepper output{min-width:34px;text-align:center;font:600 1.0625rem/1 var(--f-mono)}
.st-btn{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:50%;background:transparent}
.st-btn:hover:not(:disabled){background:var(--brand-soft)}
.st-btn:disabled{opacity:.35}
.stepper.sm .st-btn{width:36px;height:36px}
.stepper.sm{border-color:var(--line)}

/* tự tạo hộp */
.bx-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:clamp(24px,4vw,56px);align-items:start}
.bx-main{display:flex;flex-direction:column;gap:32px;min-width:0}
.bx-step .lg .n{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.7rem;letter-spacing:0}
.bx-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;margin-bottom:10px}
.bx-head .lg{margin:0}
.bx-tools{display:flex;gap:18px}
.bx-count{margin-bottom:6px;font:500 .8rem/1.4 var(--f-mono)}
.prog{height:8px;margin-bottom:14px;overflow:hidden;border-radius:999px;background:var(--line)}
.prog i{display:block;width:0;height:100%;border-radius:999px;background:var(--brand);transition:width .25s ease}
.bx-rows{display:flex;flex-direction:column;gap:10px}
.bx-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 12px 10px 10px;border:1.5px solid var(--line);border-radius:20px;background:var(--paper)}
.bx-row .thumb{display:flex;align-items:flex-end;justify-content:center;width:52px;height:64px;padding-bottom:4px;border-radius:12px}
.bx-row .thumb .bt{height:100%;width:auto}
.bx-row .meta b{display:block;font-weight:600}
.bx-row .meta span{font:400 .8rem/1.4 var(--f-mono);color:var(--muted)}
.bx-sub-note{margin-top:12px}
.bx-sum{position:sticky;top:calc(92px + env(safe-area-inset-top,0px));padding:24px;border:1px solid var(--line);border-radius:24px;background:var(--paper);box-shadow:var(--lift)}
.bx-sum h3{font-size:1.7rem;font-weight:800}
.bx-lines{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.row{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:.9rem}
.row .lbl{min-width:0}
.row .dots{flex:1;min-width:12px;border-bottom:1.5px dotted var(--muted);opacity:.5;transform:translateY(-3px)}
.row .amt{font:500 .9rem/1.4 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.neg .amt{color:var(--ok)}
.row.mute{color:var(--muted);font-size:.85rem}
.bx-save{min-height:1.4em;margin-top:8px;color:var(--ok);font-weight:600;font-size:.9rem}
.bx-total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 0 16px;padding-top:14px;border-top:2px solid var(--ink)}
.bx-total output,.bx-bar output{font:800 2.2rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.bx-note{margin-top:10px;color:var(--muted);font-size:.8125rem}
.bx-bar{display:none}

/* quy trình, đối tượng, hỏi đáp */
.steps{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.steps::before{content:"";position:absolute;left:22px;width:calc(75% + 24px);top:22px;height:2px;background:var(--line)}
.step{position:relative;display:flex;flex-direction:column;gap:10px}
.step .n{display:grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;background:var(--bg);font:500 1rem/1 var(--f-mono)}
.step .time{align-self:flex-start;padding:3px 10px;border-radius:999px;background:var(--brand-soft);font:500 .75rem/1.5 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.step h3,.who h3{font-size:1.5rem;font-weight:800}
.step p,.who p{max-width:26em;color:var(--muted)}
.who-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.who{display:flex;flex-direction:column;gap:10px}
.who .icon{width:34px;height:34px;color:var(--brand)}
.faq{max-width:46rem}
.faq details{border-bottom:1px solid var(--line)}
.faq details:first-child{border-top:1px solid var(--line)}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;font-weight:600;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;font:400 1.5rem/1 var(--f-mono);color:var(--brand)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{max-width:38em;padding:0 0 18px;color:var(--muted)}

.band{background:var(--ink);color:var(--bg)}
.band .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;padding-block:clamp(40px,5vw,64px)}
.band h2{font-size:clamp(2rem,4vw,3rem);font-weight:800}
.band p{margin-top:8px;opacity:.8}
.foot{padding-block:44px 28px;border-top:1px solid var(--line);background:var(--paper)}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:32px}
.foot h3{margin-bottom:10px;font:500 .75rem/1.4 var(--f-mono);letter-spacing:.1em;color:var(--muted)}
.foot .blurb{max-width:24em;margin-top:12px;color:var(--muted)}
.foot address{font-style:normal}
.foot address p{margin-bottom:4px;overflow-wrap:anywhere}
.legal{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.8125rem}

/* ngăn kéo giỏ hàng */
dialog.drawer{width:min(480px,100%);max-width:100%;height:100vh;height:100dvh;max-height:none;margin:0 0 0 auto;padding:0;border:0;border-left:1px solid var(--line);border-radius:0;background:var(--paper);color:var(--ink);box-shadow:var(--lift)}
dialog.drawer[open]{display:flex;flex-direction:column;animation:slide-in .28s cubic-bezier(.2,.8,.2,1)}
dialog.drawer::backdrop{background:rgb(6 12 16 / .58);animation:fade-in .2s ease-out}
@keyframes slide-in{from{opacity:0;transform:translateX(28px)}}
@keyframes slide-up{from{opacity:0;transform:translateY(28px)}}
@keyframes fade-in{from{opacity:0}}
.dr-head{display:flex;align-items:center;gap:10px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{flex:1;font-size:1.8rem;font-weight:800;outline:none}
.st-ind{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);font:500 .72rem/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.st-ind li{display:flex;align-items:center;gap:8px}
.st-ind li+li::before{content:"";width:20px;height:1px;background:var(--line)}
.st-ind li[aria-current="step"]{color:var(--ink);font-weight:600}
.dr-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:8px 20px 20px}
.dr-foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper)}
.meter{margin:12px 0 4px;padding:14px 16px;border-radius:16px;background:var(--brand-soft)}
.meter p{margin-bottom:8px;font-size:.875rem;font-weight:500}
.meter .prog{height:6px;margin:0;background:var(--paper)}
.clines{display:flex;flex-direction:column}
.cline{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:4px 14px;padding:16px 0;border-bottom:1px solid var(--line)}
.cline .thumb{display:flex;align-items:flex-end;justify-content:center;grid-row:1/span 2;width:60px;height:76px;padding-bottom:5px;border-radius:14px;color:var(--ink)}
.cline .thumb .bt{height:100%;width:auto}
.cline .thumb .icon{align-self:center;width:30px;height:30px}
.t-box{background:var(--brand-soft)}
.cmain{display:flex;flex-direction:column;min-width:0}
.cmain b{font-weight:600}
.csub{color:var(--muted);font-size:.8125rem;overflow-wrap:anywhere}
.csave{color:var(--ok);font-size:.8125rem;font-weight:600}
.cprice{font:500 .95rem/1.4 var(--f-mono);white-space:nowrap}
.cctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;grid-column:2/-1}
.link.sm{font-size:.85rem}
.cempty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:32px 0}
.stack{display:flex;flex-direction:column;gap:22px;padding-top:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9rem}
.in{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);font:inherit;color:var(--ink)}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
.in[aria-invalid="true"]{border-color:var(--bad)}
textarea.in{min-height:84px;resize:vertical}
.err{color:var(--bad);font-size:.85rem}
.hint{margin-top:6px;color:var(--muted);font-size:.8125rem}
.sum{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.sum .r{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.sum .r span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sum .r.total{margin-top:4px;padding-top:10px;border-top:2px solid var(--ink);font:800 1.6rem/1.1 var(--f-display);text-transform:uppercase}
.sum .r.total span:last-child{font-family:var(--f-display)}
.sum .nudge{padding:8px 12px;border-radius:12px;background:var(--brand-soft);font-size:.85rem}
.done{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:20px 0 8px}
.done .tick{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;background:var(--ok);color:var(--paper)}
.done .tick .icon{width:30px;height:30px;stroke-width:2.5}
.done h3{font-size:2.2rem;font-weight:800}
.facts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;width:100%;padding:16px 0;border-block:1px dashed var(--muted)}
.facts2 dt{font:500 .72rem/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts2 dd{margin-top:2px;font-weight:600}
.done .note{color:var(--muted);font-size:.9rem}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--lift);transform:translateX(-50%)}
.toast button{padding:4px;border:0;background:none;font-weight:700;text-decoration:underline;text-underline-offset:3px}

@media (max-width:1100px){
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps::before{display:none}
}
@media (max-width:900px){
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .hero-art{max-width:480px}
  .bx-grid{grid-template-columns:minmax(0,1fr)}
  .bx-sum{position:static}
  .bx-sum .js-bx-add{display:none}
  .bx-bar{display:flex;position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:20;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 18px;border:1px solid var(--line);border-radius:999px;background:var(--paper);box-shadow:var(--lift)}
  .bx-bar p{font:500 .72rem/1.3 var(--f-mono);color:var(--muted)}
}
@media (max-width:860px){
  .menu-btn{display:inline-grid}
  .tools{margin-left:auto}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;margin:0;padding:4px max(16px,env(safe-area-inset-left,0px)) 14px;border-bottom:1px solid var(--line);background:var(--paper)}
  .nav.open{display:flex}
  .nav a{padding:14px 0;border-bottom:1px solid var(--line)}
  .who-grid,.foot-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .usp ul{grid-template-columns:repeat(2,minmax(0,1fr))}
  .usp li:nth-child(odd){padding-left:0;border-left:0}
  .usp li:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:640px){
  dialog.drawer{width:100%;height:auto;max-height:92vh;max-height:92dvh;margin:auto 0 0;border:0;border-radius:24px 24px 0 0}
  dialog.drawer[open]{animation-name:slide-up}
  .pgrid{gap:12px}
  .pmedia{height:210px;padding-top:44px}
  .pbody{padding:14px}
  .prow h3{font-size:1.45rem}
  .pdesc,.notes{display:none}
  .pact .btn{padding-inline:.5rem;white-space:nowrap;font-size:.95rem}
  .steps{grid-template-columns:minmax(0,1fr)}
  .cart-btn .lbl{display:none}
}
@media (max-width:480px){
  .tools .lang{display:none}
  .nav .lang{display:inline-flex;align-self:flex-start;margin-top:14px}
  .chip{flex-basis:calc(50% - 5px)}
  .bx-row{grid-template-columns:44px minmax(0,1fr) auto;gap:10px}
  .bx-row .thumb{width:44px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

          h('button', { type: 'button', class: 'st-btn', id: 'bdec-' + p.sku, 'data-bact': 'dec', 'data-sku': p.sku, 'aria-label': t('bx.dec', { name }) }, icon('minus')),
          h('output', { 'data-bn': p.sku }, '0'),
          h('button', { type: 'button', class: 'st-btn', id: 'binc-' + p.sku, 'data-bact': 'inc', 'data-sku': p.sku, 'aria-label': t('bx.inc', { name }) }, icon('plus'))));
    }));
    $('#bx-mode').replaceChildren(
      chip('bmode', 'once', t('bx.once'), t('bx.once.s'), !b.sub, 'bmode-once'),
      chip('bmode', 'sub', t('bx.sub'), t('bx.sub.s', { pct: pct(sub.off) }), b.sub, 'bmode-sub'));
    $('#bx-freq').replaceChildren(...sub.freqs.map(f => chip('bfreq', f, t('bx.f.' + f), '', b.freq === f, 'bfreq-' + f)));
    updateBuilder();
  }
  function updateBuilder() {
    const b = state.box, q = boxQuote(b), full = q.n === b.size, left = b.size - q.n;
    PRODUCTS.forEach(p => {
      const n = b.picks[p.sku] || 0;
      $('[data-bn="' + p.sku + '"]').textContent = n;
      $('#bdec-' + p.sku).disabled = n === 0;
      $('#binc-' + p.sku).disabled = full;
    });
    const countText = t('bx.count', { n: q.n, max: b.size });
    $('#bx-count').textContent = countText;
    $$('.js-bx-count').forEach(el => { el.textContent = countText; });
    $('#bx-prog').style.width = (q.n / b.size * 100) + '%';
    $('#bx-fill').disabled = full;
    $('#bx-clear').disabled = q.n === 0;
    $('#bx-freq-wrap').hidden = !b.sub;
    const lines = PRODUCTS.filter(p => (b.picks[p.sku] || 0) > 0).map(p => row((b.picks[p.sku]) + ' × ' + p.name.join(' '), money(b.picks[p.sku] * p.price)));
    if (!lines.length) lines.push(h('li', { class: 'row mute' }, t('bx.empty')));
    if (q.boxOff) lines.push(row(t('bx.sum.box', { pct: pct(q.bRate) }), money(-q.boxOff), 'neg'));
    if (q.subOff) lines.push(row(t('bx.sum.sub', { pct: pct(q.sRate) }), money(-q.subOff), 'neg'));
    $('#bx-lines').replaceChildren(...lines);
    $('#bx-save').textContent = q.save > 0 ? t('bx.sum.save', { amount: money(q.save) }) : '';
    $$('.js-bx-total').forEach(el => { el.textContent = money(q.total); });
    $$('.js-bx-add').forEach(btn => {
      btn.disabled = !full;
      btn.textContent = full ? t('bx.add') : t('bx.add.need', { n: fmtNum(left), unit: t('u.bottle.' + (left === 1 ? '1' : 'n')) });
    });
  }
  function trimPicks(b) {
    let over = pickCount(b.picks) - b.size;
    for (let i = PRODUCTS.length - 1; i >= 0 && over > 0; i--) {
      const sku = PRODUCTS[i].sku, take = Math.min(b.picks[sku] || 0, over);
      b.picks[sku] = (b.picks[sku] || 0) - take;
      over -= take;
    }
  }
  function fillRest(b) {
    let left = b.size - pickCount(b.picks);
    while (left-- > 0) {
      let best = PRODUCTS[0].sku;
      PRODUCTS.forEach(p => { if ((b.picks[p.sku] || 0) < (b.picks[best] || 0)) best = p.sku; });
      b.picks[best] = (b.picks[best] || 0) + 1;
    }
  }
  function addBox() {
    const b = state.box;
    if (pickCount(b.picks) !== b.size) return;
    state.cart.push({ id: ++state.seq, type: 'box', size: b.size, picks: Object.assign({}, b.picks), sub: b.sub, freq: b.freq });
    PRODUCTS.forEach(p => { b.picks[p.sku] = 0; });
    updateBuilder();
    cartChanged(true);
    showToast(t('toast.box'), t('toast.view'), () => openCart('cart'));
  }

  /* -- ngăn kéo giỏ hàng -- */
  const dlg = $('#cart');
  function jobLine(it) {
    if (it.type === 'bottle') {
      const p = BYSKU[it.sku], name = p.name.join(' ');
      return h('li', { class: 'cline' },
        h('span', { class: 'thumb t-' + p.sku }, bottleSVG(p)),
        h('div', { class: 'cmain' }, h('b', null, name), h('span', { class: 'csub' }, money(p.price) + ' · 250 ml')),
        h('p', { class: 'cprice' }, money(lineTotal(it))),
        h('div', { class: 'cctrl' },
          h('div', { class: 'stepper sm' },
            h('button', { type: 'button', class: 'st-btn', 'data-cact': 'dec', 'data-id': it.id, 'aria-label': t('cart.qty.dec', { name }), disabled: it.qty <= 1 }, icon('minus')),
            h('output', null, it.qty),
            h('button', { type: 'button', class: 'st-btn', 'data-cact': 'inc', 'data-id': it.id, 'aria-label': t('cart.qty.inc', { name }), disabled: it.qty >= SHOP.maxPerLine }, icon('plus'))),
          h('button', { type: 'button', class: 'link sm', 'data-cact': 'rm', 'data-id': it.id, 'aria-label': t('cart.remove.l', { name }) }, t('cart.remove'))));
    }
    const q = boxQuote(it), name = t('cart.box', { n: it.size });
    const picks = PRODUCTS.filter(p => it.picks[p.sku]).map(p => it.picks[p.sku] + ' × ' + p.name.join(' ')).join(', ');
    return h('li', { class: 'cline' },
      h('span', { class: 'thumb t-box' }, icon('box')),
      h('div', { class: 'cmain' },
        h('b', null, name),
        h('span', { class: 'csub' }, it.sub ? t('cart.subf', { freq: t('bx.f.' + it.freq).toLowerCase() }) : t('cart.once')),
        h('span', { class: 'csub' }, picks),
        q.save > 0 ? h('span', { class: 'csave' }, t('bx.sum.save', { amount: money(q.save) })) : null),
      h('p', { class: 'cprice' }, money(q.total)),
      h('div', { class: 'cctrl' }, h('span'),
        h('button', { type: 'button', class: 'link sm', 'data-cact': 'rm', 'data-id': it.id, 'aria-label': t('cart.remove.l', { name }) }, t('cart.remove'))));
  }
  function sumRows(rows) {
    return rows.map(r => h('div', { class: 'r' + (r.cls ? ' ' + r.cls : '') }, h('span', null, r[0]), h('span', null, r[1])));
  }
  function renderCartView(focusSel) {
    const empty = state.cart.length === 0, sub = cartSubtotal(), free = SHOP.freeDeliveryFrom;
    $('#clines').replaceChildren(...state.cart.map(jobLine));
    $('#cempty').hidden = !empty;
    $('#meter').hidden = empty;
    if (!empty) {
      const full = hasSub() || sub >= free, ratio = full ? 1 : sub / free;
      $('#meter-t').textContent = hasSub() ? t('meter.sub') : (sub >= free ? t('meter.free') : t('meter.away', { amount: money(free - sub) }));
      $('#meter-i').style.width = Math.round(ratio * 100) + '%';
      $('#meter-bar').setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
    }
    $('#dr-sum').replaceChildren(...sumRows([[t('tot.sub'), money(sub)], [t('tot.ship'), t('tot.later')]]));
    $('#dr-primary').textContent = t('cart.checkout');
    $('#dr-primary').disabled = empty;
    $('#dr-secondary').textContent = t('cart.continue');
    $('#dr-secondary').hidden = false;
    if (focusSel) { const el = $(focusSel); if (el && !el.disabled) el.focus(); }
  }
  function renderDetailsView() {
    const dsub = {
      pickup: t('co.d.pickup.s'),
      standard: t('co.d.standard.s', { price: money(SHOP.delivery.standard), free: money(SHOP.freeDeliveryFrom) }),
      express: t('co.d.express.s', { price: money(SHOP.delivery.express) })
    };
    $('#co-delivery').replaceChildren(...DELIVERY.map(d => chip('delivery', d, t('co.d.' + d), dsub[d], state.delivery === d, 'delivery-' + d)));
    $('#co-payment').replaceChildren(...PAYMENT.map(p => chip('payment', p, t('co.p.' + p), '', state.payment === p, 'payment-' + p)));
    renderDetailsSum();
    renderErrors();
    $('#dr-primary').textContent = t('co.submit');
    $('#dr-primary').disabled = false;
    $('#dr-secondary').hidden = true;
  }
  function renderDetailsSum() {
    const tt = totals();
    $('#f-address').hidden = state.delivery === 'pickup';
    const rows = sumRows([
      [t('tot.sub'), money(tt.subtotal)],
      [t('tot.ship'), tt.fee ? money(tt.fee) : t('tot.free')],
      Object.assign([t('tot.total'), money(tt.total)], { cls: 'total' })
    ]);
    if (state.delivery === 'standard' && !hasSub() && tt.subtotal < SHOP.freeDeliveryFrom) {
      rows.unshift(h('p', { class: 'nudge' }, t('co.free.hint', { amount: money(SHOP.freeDeliveryFrom - tt.subtotal) })));
    }
    $('#dr-sum').replaceChildren(...rows);
  }
  function renderErrors() {
    ['name', 'phone', 'address'].forEach(k => {
      const msg = $('#e-' + k), input = $('#c-' + k), key = state.errs[k];
      msg.hidden = !key;
      msg.textContent = key ? t(key) : '';
      if (key) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    });
  }
  function renderDone() {
    const p = state.placed;
    $('#v-done').replaceChildren(
      h('div', { class: 'tick' }, icon('check')),
      h('h3', null, t('ok.title')),
      h('p', null, t('ok.thanks', { name: p.name })),
      h('dl', { class: 'facts2' },
        h('div', null, h('dt', null, t('ok.code')), h('dd', null, p.code)),
        h('div', null, h('dt', null, t('ok.total')), h('dd', null, money(p.total))),
        h('div', null, h('dt', null, t('ok.eta')), h('dd', null, t('ok.eta.' + p.delivery)))),
      ...p.subs.map(f => h('p', null, t('ok.sub', { freq: t('bx.f.' + f).toLowerCase() }))),
      h('p', { class: 'note' }, t('ok.note')),
      h('button', { type: 'button', class: 'btn', id: 'done-btn' }, t('ok.done')));
  }
  function renderDrawer(focusSel) {
    const v = state.placed ? 'done' : state.view;
    $('#v-cart').hidden = v !== 'cart';
    $('#v-details').hidden = v !== 'details';
    $('#v-done').hidden = v !== 'done';
    $('#dr-title').textContent = t('dr.title.' + v);
    $('#dr-back').hidden = v !== 'details';
    $('#dr-foot').hidden = v === 'done' || (v === 'cart' && state.cart.length === 0);
    $$('#st-ind li').forEach(li => { if (li.dataset.st === v) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
    if (v === 'cart') renderCartView(focusSel);
    else if (v === 'details') renderDetailsView();
    else renderDone();
  }
  function openCart(view) {
    $('#toast').hidden = true;
    state.view = state.cart.length ? (view || 'cart') : 'cart';
    renderDrawer();
    if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
    document.documentElement.classList.add('lock');
    $('#dr-title').focus();
  }
  // Sự kiện "close" của <dialog> chạy bất đồng bộ nên phần dọn dẹp được tách riêng và gọi từ cả hai đường (chạy lại an toàn).
  function afterClose() {
    document.documentElement.classList.remove('lock');
    if (state.placed) {
      state.cart = []; state.placed = null; state.errs = {}; state.view = 'cart';
      state.delivery = 'standard'; state.payment = 'cod';
      $('#v-details').reset();
      updateShop();
      renderBadge();
    }
  }
  function closeCart() {
    if (dlg.open) dlg.close();
    afterClose();
  }
  function goView(v) {
    state.view = v;
    renderDrawer();
    $('#dr-title').focus();
    $('#dr-body').scrollTop = 0;
  }
  function validate() {
    const errs = {};
    if ($('#c-name').value.trim().length < 2) errs.name = 'err.name';
    if (!/^\+?\d{9,12}$/.test($('#c-phone').value.replace(/[\s.\-()]/g, ''))) errs.phone = 'err.phone';
    if (state.delivery !== 'pickup' && $('#c-address').value.trim().length < 6) errs.address = 'err.address';
    state.errs = errs;
    renderErrors();
    const first = Object.keys(errs)[0];
    if (first) $('#c-' + first).focus();
    return !first;
  }
  function submitOrder() {
    if (!state.cart.length || !validate()) return;
    state.placed = {
      code: '#' + (1000 + Math.floor(Math.random() * 9000)),
      name: $('#c-name').value.trim(),
      delivery: state.delivery,
      total: totals().total,
      subs: state.cart.filter(it => it.type === 'box' && it.sub).map(it => it.freq)
    };
    renderDrawer();
    $('#dr-title').focus();
    $('#dr-body').scrollTop = 0;
  }

  /* -- chung -- */
  let toastTimer = 0;
  function showToast(msg, actionLabel, action) {
    const el = $('#toast');
    el.replaceChildren(h('span', null, msg));
    if (actionLabel) {
      const b = h('button', { type: 'button' }, actionLabel);
      b.addEventListener('click', () => { el.hidden = true; action(); });
      el.append(b);
    }
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
  }
  function goTo(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView();
  }
  // Lưu ngôn ngữ chỉ là tiện ích: bọc try/catch vì trình duyệt có thể chặn.
  function loadLang() {
    try { const v = localStorage.getItem('brewgo-lang'); if (v === 'vi' || v === 'en') return v; } catch (e) { /* bỏ qua */ }
    return 'en';
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem('brewgo-lang', l); } catch (e) { /* bỏ qua */ }
    renderAll();
  }
  function renderAll() {
    applyStatic();
    renderFilter();
    renderShop();
    renderBuilder();
    renderBadge();
    if (dlg.open) renderDrawer();
    fitLabels();
  }

  function bind() {
    $$('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    $('#menu-btn').addEventListener('click', () => {
      const open = $('#nav').classList.toggle('open');
      $('#menu-btn').setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href').slice(1);
      if (!document.getElementById(id)) return;
      e.preventDefault();
      $('#nav').classList.remove('open');
      $('#menu-btn').setAttribute('aria-expanded', 'false');
      goTo(id);
    });

    // cửa hàng
    $('#filter').addEventListener('change', e => { state.filter = e.target.value; applyFilter(); });
    $('#products').addEventListener('click', e => {
      const add = e.target.closest('.add'), st = e.target.closest('[data-act]');
      if (add) setLoose(add.dataset.sku, looseQty(add.dataset.sku) + 1, '#inc-' + add.dataset.sku);
      else if (st) {
        const sku = st.dataset.sku, q = looseQty(sku) + (st.dataset.act === 'inc' ? 1 : -1);
        setLoose(sku, q, q > 0 ? '#' + st.dataset.act + '-' + sku : '#add-' + sku);
      }
    });

    // tự tạo hộp
    $('#box').addEventListener('change', e => {
      const el = e.target, b = state.box;
      if (el.name === 'bsize') { b.size = Number(el.value); trimPicks(b); updateBuilder(); }
      else if (el.name === 'bmode') { b.sub = el.value === 'sub'; updateBuilder(); }
      else if (el.name === 'bfreq') { b.freq = el.value; updateBuilder(); }
    });
    $('#box').addEventListener('click', e => {
      const b = state.box, st = e.target.closest('[data-bact]');
      if (st) {
        const sku = st.dataset.sku, cur = b.picks[sku] || 0;
        if (st.dataset.bact === 'inc' && pickCount(b.picks) < b.size) b.picks[sku] = cur + 1;
        if (st.dataset.bact === 'dec' && cur > 0) b.picks[sku] = cur - 1;
        updateBuilder();
        const again = $('#b' + st.dataset.bact + '-' + sku);
        if (again && again.disabled) { const other = $('#b' + (st.dataset.bact === 'inc' ? 'dec' : 'inc') + '-' + sku); if (other && !other.disabled) other.focus(); }
      } else if (e.target.closest('#bx-fill')) { fillRest(b); updateBuilder(); }
      else if (e.target.closest('#bx-clear')) { PRODUCTS.forEach(p => { b.picks[p.sku] = 0; }); updateBuilder(); }
      else if (e.target.closest('.js-bx-add')) addBox();
    });

    // giỏ hàng
    $('#cart-btn').addEventListener('click', () => openCart('cart'));
    $('#dr-close').addEventListener('click', closeCart);
    $('#dr-back').addEventListener('click', () => goView('cart'));
    $('#cempty-btn').addEventListener('click', () => { closeCart(); goTo('shop'); });
    dlg.addEventListener('click', e => { if (e.target === dlg) closeCart(); });
    dlg.addEventListener('close', afterClose); // phím Esc đóng hộp thoại bằng đường này
    $('#dr-primary').addEventListener('click', () => {
      const v = state.view;
      if (v === 'cart') { if (state.cart.length) goView('details'); }
      else if (v === 'details') submitOrder();
    });
    $('#dr-secondary').addEventListener('click', () => { closeCart(); goTo('shop'); });
    $('#clines').addEventListener('click', e => {
      const b = e.target.closest('[data-cact]');
      if (!b) return;
      const id = Number(b.dataset.id), it = state.cart.find(x => x.id === id);
      if (!it) return;
      if (b.dataset.cact === 'rm') {
        state.cart = state.cart.filter(x => x.id !== id);
        cartChanged(false, '#dr-title');
      } else {
        it.qty = clamp(it.qty + (b.dataset.cact === 'inc' ? 1 : -1), 1, SHOP.maxPerLine);
        cartChanged(false, '[data-cact="' + b.dataset.cact + '"][data-id="' + id + '"]');
      }
    });
    const form = $('#v-details');
    form.addEventListener('change', e => {
      if (e.target.name === 'delivery') { state.delivery = e.target.value; renderDetailsSum(); }
      if (e.target.name === 'payment') state.payment = e.target.value;
    });
    form.addEventListener('submit', e => { e.preventDefault(); submitOrder(); });
    $('#v-done').addEventListener('click', e => { if (e.target.closest('#done-btn')) closeCart(); });
  }

  lang = loadLang();
  $$('.mark').forEach(el => { el.innerHTML = logoInner(); });
  $('#hero-art').replaceChildren(svgFrom(heroMarkup()));
  bind();
  renderAll();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitLabels);
    document.fonts.addEventListener('loadingdone', fitLabels);
  }

  // Cho kiểm thử trên trình duyệt.
  window.__shop = { SHOP, PRODUCTS, S, state, boxQuote, deliveryFee, totals, setLang, fitLabels };
})();
</script>
</body>
</html>
