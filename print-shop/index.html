<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>PrintGo</title>
<meta name="description" content="Print documents online and get them delivered to your door. A demo storefront for a course project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Bố cục: tờ in thử (proof sheet). Nền giấy trắng, chữ mực đen, xanh cyan cho phần tương tác.
   Điểm nhấn duy nhất: chữ cuối của tiêu đề hero bị "lệch màu in" cyan/magenta. */
:root{
  --bg:#F5F6F8; --paper:#FFFFFF; --ink:#12141A; --muted:#566070; --line:#D8DCE5;
  --brand:#0069A8; --brand-ink:#FFFFFF; --brand-soft:#E2F1FA;
  --c:#00AEEF; --m:#EC008C; --y:#FFD500; --k:#12141A;
  --ok:#0B7A55; --bad:#BE2338;
  --lift:0 1px 0 rgb(18 20 26 / .05),0 18px 40px -18px rgb(18 20 26 / .35);
  --f-display:"Bricolage Grotesque","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F13; --paper:#161920; --ink:#EEF0F5; --muted:#A3AAB8; --line:#2B303B;
    --brand:#5CC8F7; --brand-ink:#04202F; --brand-soft:#0F2F40; --k:#EEF0F5;
    --ok:#4BD6A0; --bad:#FF8190;
    --lift:0 1px 0 rgb(0 0 0 / .4),0 18px 40px -18px rgb(0 0 0 / .8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F13; --paper:#161920; --ink:#EEF0F5; --muted:#A3AAB8; --line:#2B303B;
  --brand:#5CC8F7; --brand-ink:#04202F; --brand-soft:#0F2F40; --k:#EEF0F5;
  --ok:#4BD6A0; --bad:#FF8190;
  --lift:0 1px 0 rgb(0 0 0 / .4),0 18px 40px -18px rgb(0 0 0 / .8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,p,ul,ol,dl,dd,figure,address{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.02em;line-height:1.08}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:2px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:8px}
.skip:focus{left:8px;z-index:100;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:6px}
.eyebrow,.cap,.lg{font:500 .75rem/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-wrap:balance}
.lg{display:block;margin-bottom:10px}
.lg.flush{margin:0}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.7rem 1.25rem;border:1.5px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none;transition:background-color .15s,color .15s,border-color .15s}
.btn:hover{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.invert{background:var(--bg);border-color:var(--bg);color:var(--ink)}
.btn.invert:hover{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.block{width:100%}
.link{align-self:flex-start;border:0;background:none;padding:6px 0;font-weight:600;color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--line);border-radius:6px;background:transparent}
.icon-btn:hover{border-color:var(--ink)}

/* đầu trang */
.demo{background:var(--ink);color:var(--bg);font:500 .72rem/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.demo .wrap{padding-block:7px;text-align:center}
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:800 1.3rem/1 var(--f-display);letter-spacing:-.03em}
.mark{width:30px;height:30px}
.nav{display:flex;gap:24px;margin-left:auto}
.nav a{padding:8px 0;border-bottom:2px solid transparent;font-weight:500;text-decoration:none}
.nav a:hover{border-bottom-color:var(--brand)}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.lang button{min-width:40px;min-height:36px;border:0;background:transparent;font:500 .8rem/1 var(--f-mono)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline-offset:-3px}
.cart-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1.5px solid var(--ink);border-radius:6px;background:transparent;font-weight:600}
.cart-btn:hover{background:var(--brand-soft)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--y);color:#12141A;font:600 .72rem/20px var(--f-mono);text-align:center}
.menu-btn{display:none}
.nav .lang{display:none}

/* hero */
.hero{padding-block:clamp(32px,6vw,72px) clamp(40px,6vw,80px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(24px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.9rem);font-weight:800;line-height:1;margin:16px 0 22px}
.misreg{white-space:nowrap;text-shadow:-.035em 0 0 color-mix(in srgb,var(--c) 85%,transparent),.035em .015em 0 color-mix(in srgb,var(--m) 75%,transparent)}
.hero .sub{max-width:34em;color:var(--muted);font-size:clamp(1.05rem,.6rem + 1.4vw,1.25rem)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.art{max-width:540px;width:100%;justify-self:center}
.art svg{display:block;width:100%;height:auto}
.art .dim{stroke:var(--muted);stroke-width:1;fill:none}
.art .lbl{font:500 11px var(--f-mono);fill:var(--muted);letter-spacing:.06em}
.art .crop{stroke:var(--ink);stroke-width:1.5;fill:none}
.art .shadow{fill:var(--ink);opacity:.12}
.art .sheet{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.art .ink{fill:var(--ink)}
.art .mut{fill:var(--ink);opacity:.2}
.art .soft{fill:var(--brand-soft)}
.art .hill{fill:var(--brand);opacity:.45}
.art .sun{fill:var(--y)}
.art .tag{font:500 11px var(--f-mono);fill:var(--paper);letter-spacing:.04em}
.art .c{fill:var(--c)}.art .m{fill:var(--m)}.art .y{fill:var(--y)}.art .k{fill:var(--k)}
.art .reg{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.55}
.art .stk{fill:var(--y)}
.art .stk-ring{fill:none;stroke:#12141A;stroke-width:1.5;stroke-dasharray:3 4}
.art .stk-t{font:500 10px var(--f-mono);fill:#12141A;letter-spacing:.2em}
.art .stk-n{font:800 46px var(--f-display);fill:#12141A;letter-spacing:-.03em}

/* dải thông tin nhanh */
.usp{border-block:1px solid var(--line)}
.usp ul{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.usp li{padding:18px 20px;border-left:1px solid var(--line)}
.usp li:first-child{border-left:0;padding-left:0}
.usp .v{display:block;margin-top:4px;font:700 1.25rem/1.25 var(--f-display);letter-spacing:-.01em}

/* khối nội dung */
.sec{padding-block:clamp(56px,8vw,104px)}
.sec.alt{background:var(--paper);border-block:1px solid var(--line)}
section[id]{scroll-margin-top:76px}
.sec-head{max-width:46rem;margin-bottom:clamp(28px,4vw,48px)}
.sec-head h2{margin-top:10px;font-size:clamp(1.9rem,3.6vw,3rem);font-weight:700}
.sec-head .lead{max-width:38em;margin-top:14px;color:var(--muted);font-size:1.0625rem}

.svc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 28px}
.svc{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:2px solid var(--ink)}
.svc .tag{font:500 .72rem/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.svc h3{font-size:1.35rem;font-weight:700}
.svc p{color:var(--muted);font-size:.95rem}
.svc .price{margin-top:auto;padding-top:8px;font:500 .9rem/1.4 var(--f-mono);color:var(--ink)}

/* báo giá */
.quote-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:clamp(24px,4vw,56px);align-items:start}
.job{display:flex;flex-direction:column;gap:28px;min-width:0}
.fs{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;flex:1 1 150px;min-width:0}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip .box{display:flex;flex-direction:column;gap:2px;height:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);transition:border-color .15s,background-color .15s}
.chip .box b{font-weight:600;line-height:1.35}
.chip .box small{font:400 .75rem/1.4 var(--f-mono);color:var(--muted)}
.chip:hover .box{border-color:var(--muted)}
.chip input:checked+.box{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.chip input:focus-visible+.box{outline:3px solid var(--brand);outline-offset:2px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.num{display:flex;align-items:stretch;overflow:hidden;border:1.5px solid var(--line);border-radius:6px;background:var(--paper)}
.num:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.num button{display:grid;place-items:center;width:46px;border:0;background:transparent}
.num button:hover{background:var(--brand-soft)}
.num input{flex:1;min-width:0;width:100%;padding:11px 0;border:0;background:transparent;text-align:center;font:600 1.0625rem/1.2 var(--f-mono);-moz-appearance:textfield}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num input:focus{outline:none}
.hint{margin-top:6px;color:var(--muted);font-size:.8125rem}
.hint.bad{color:var(--bad)}
.drop{position:relative}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop-label{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:16px 18px;border:1.5px dashed var(--muted);border-radius:6px;background:var(--paper);cursor:pointer}
.drop-label:hover,.drop.over .drop-label{border-color:var(--brand);background:var(--brand-soft)}
.drop input:focus-visible+.drop-label{outline:3px solid var(--brand);outline-offset:2px}
.drop-label .main{font-weight:600}
.drop-label .sub{font:400 .75rem/1.4 var(--f-mono);color:var(--muted)}
.drop-file{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper)}
.drop-file .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.drop-file .size{font:400 .75rem/1.4 var(--f-mono);color:var(--muted);white-space:nowrap}

.slip{position:sticky;top:calc(88px + env(safe-area-inset-top,0px));padding:22px 22px 24px;border:1px solid var(--line);border-radius:4px;background:var(--paper);box-shadow:var(--lift)}
.slip h3{font-size:1.5rem;font-weight:700}
.slip-spec{margin-top:4px;color:var(--muted);font:400 .8rem/1.4 var(--f-mono)}
.slip-lines{margin-top:16px;padding-top:12px;border-top:2px dashed var(--line)}
.slip-row{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:.9rem}
.slip-row .lbl{min-width:0}
.slip-row .dots{flex:1;min-width:12px;border-bottom:1.5px dotted var(--muted);opacity:.5;transform:translateY(-3px)}
.slip-row .amt{font:500 .9rem/1.4 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.slip-row.neg .amt{color:var(--ok)}
.slip-row.info{color:var(--muted);font-size:.8125rem}
.slip-hint{margin-top:12px;padding:10px 12px;border-radius:4px;background:var(--brand-soft);font-size:.875rem}
.slip-total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 0 16px;padding-top:14px;border-top:2px solid var(--ink)}
.slip-total output{font:700 2rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.slip-note{margin-top:10px;color:var(--muted);font-size:.8125rem}

/* bảng giá */
.price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;align-items:start}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl caption{padding-bottom:10px;text-align:left;font:500 .75rem/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tbl th,.tbl td{padding:12px 0;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.tbl thead th{font:500 .75rem/1.4 var(--f-mono);color:var(--muted)}
.tbl tbody th{font-weight:600}
.tbl th:not(:first-child),.tbl td{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.perks{margin-top:10px}
.perks li{padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.price-note{margin-top:20px;color:var(--muted);font-size:.8125rem}

/* quy trình, đối tượng */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.step{display:flex;flex-direction:column;gap:10px}
.step .n{display:grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;font:500 1rem/1 var(--f-mono)}
.step h3,.who h3{font-size:1.3rem;font-weight:700}
.step p,.who p{max-width:26em;color:var(--muted)}
.who-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.who{display:flex;flex-direction:column;gap:10px}
.who .icon{width:32px;height:32px;color:var(--brand)}

.faq{max-width:46rem}
.faq details{border-bottom:1px solid var(--line)}
.faq details:first-child{border-top:1px solid var(--line)}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;font-weight:600;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;font:400 1.5rem/1 var(--f-mono);color:var(--brand)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{max-width:38em;padding:0 0 18px;color:var(--muted)}

.cmyk{display:flex;height:8px}
.cmyk i{flex:1}
.cmyk i:nth-child(1){background:var(--c)}.cmyk i:nth-child(2){background:var(--m)}.cmyk i:nth-child(3){background:var(--y)}.cmyk i:nth-child(4){background:var(--k)}
.band{background:var(--ink);color:var(--bg)}
.band .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;padding-block:clamp(36px,5vw,60px)}
.band h2{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:700}
.band p{margin-top:8px;opacity:.8}

.foot{padding-block:44px 28px;border-top:1px solid var(--line);background:var(--paper)}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:32px}
.foot h3{margin-bottom:10px;font:500 .75rem/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.foot .blurb{max-width:24em;margin-top:12px;color:var(--muted)}
.foot address{font-style:normal}
.foot address p{margin-bottom:4px;overflow-wrap:anywhere}
.legal{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.8125rem}

/* hộp thoại thanh toán */
dialog{width:min(720px,calc(100% - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);box-shadow:var(--lift)}
dialog::backdrop{background:rgb(8 10 14 / .62)}
.co-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.co-head h2{font-size:1.5rem;font-weight:700}
.co-body{padding:20px}
.stack{display:flex;flex-direction:column;gap:24px}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:first-child{border-top:1px solid var(--line)}
.item .t{font-weight:600}
.item .d{grid-column:1;color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
.item .p{grid-row:1;grid-column:2;padding-top:2px;font:500 .95rem/1.4 var(--f-mono);white-space:nowrap}
.item .icon-btn{grid-row:1/span 2;grid-column:3;width:34px;height:34px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9rem}
.in{width:100%;min-height:46px;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);font:inherit;color:var(--ink)}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.in[aria-invalid="true"]{border-color:var(--bad)}
textarea.in{min-height:84px;resize:vertical}
.err{color:var(--bad);font-size:.85rem}
.sum{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:2px solid var(--ink)}
.sum .r{display:flex;justify-content:space-between;gap:12px}
.sum .r span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sum .r.total{margin-top:4px;font:700 1.4rem/1.2 var(--f-display)}
.sum .r.total span:last-child{font-family:var(--f-display)}
.sum .nudge{padding:8px 10px;border-radius:4px;background:var(--brand-soft);font-size:.85rem}
.done{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:12px 0 8px}
.done .tick{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--ok);color:var(--paper)}
.done .tick .icon{width:28px;height:28px;stroke-width:2.5}
.done h3{font-size:1.75rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;width:100%;padding:16px 0;border-block:1px dashed var(--muted)}
.facts dt{font:500 .72rem/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin-top:2px;font-weight:600}
.done .note{color:var(--muted);font-size:.9rem}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:8px;background:var(--ink);color:var(--bg);box-shadow:var(--lift);transform:translateX(-50%)}
.toast button{padding:4px;border:0;background:none;font-weight:700;text-decoration:underline;text-underline-offset:3px}

@media (max-width:1020px){
  .svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .price-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .art{max-width:460px}
  .quote-grid{grid-template-columns:minmax(0,1fr)}
  .slip{position:static}
}
@media (max-width:860px){
  .menu-btn{display:inline-grid}
  .tools{margin-left:auto}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;margin:0;padding:4px max(16px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--line);background:var(--paper)}

  .steps,.who-grid{grid-template-columns:minmax(0,1fr)}
  .foot-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .usp ul{grid-template-columns:repeat(2,minmax(0,1fr))}
  .usp li:nth-child(odd){padding-left:0;border-left:0}
  .usp li:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:620px){
  .price-grid,.svc-grid{grid-template-columns:minmax(0,1fr)}
  .cart-btn .lbl{display:none}
}
@media (max-width:480px){
  .tools .lang{display:none}
  .nav .lang{display:inline-flex;align-self:flex-start;margin-top:14px}
  .pair{grid-template-columns:minmax(0,1fr)}
  .chip{flex-basis:calc(50% - 5px)}
  .item{grid-template-columns:minmax(0,1fr) auto}
  .item .icon-btn{grid-column:2;grid-row:2}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}

  const $ = (s, r) => (r || document).querySelector(s);

  let lang = 'en';

  function t(key, vars) {
    const row = S[key];
    if (!row) { console.warn('Thiếu nội dung:', key); return key; }
    const all = Object.assign({ brand: SHOP.brand, year: new Date().getFullYear() }, vars);
    return row[lang === 'vi' ? 1 : 0].replace(/\{(\w+)\}/g, (m, k) => (k in all ? all[k] : m));
  }
  const fmtNum = n => new Intl.NumberFormat(lang === 'vi' ? 'vi-VN' : 'en-US').format(n);
  const money = n => (n < 0 ? '−' : '') + fmtNum(Math.abs(n)) + '₫';
  const pct = r => Math.round(r * 100);
  const cnt = (n, unit) => fmtNum(n) + ' ' + t('u.' + unit + (n === 1 ? '.1' : '.n'));
  const clampInt = (v, min, max, fallback) => {
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
  };

        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : String(kid));
    }
    return el;
  }
  function icon(name) {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'icon');
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS(NS, 'use');
    use.setAttribute('href', '#i-' + name);
    svg.append(use);
    return svg;
  }
  function chip(name, value, title, sub, checked) {
    return h('label', { class: 'chip' },
      h('input', { type: 'radio', name, value, id: name + '-' + value, checked: checked }),
      h('span', { class: 'box' }, h('b', null, title), h('small', null, sub)));
  }

  /* ===== 4. Dữ liệu và tính giá ===== */
  const SIZES = [{ v: 'a4', name: 'A4', sub: '210 × 297 mm' }, { v: 'a3', name: 'A3', sub: '297 × 420 mm' }];
  const COLORS = ['bw', 'color'];
  const SIDES = ['single', 'double'];
  const BINDINGS = ['none', 'staple', 'spiral', 'glue'];
  const DELIVERY = ['pickup', 'standard', 'express'];
  const PAYMENT = ['cod', 'bank', 'wallet'];
  const PRESETS = {
    docs:   { size: 'a4', color: 'bw',    sides: 'double', pages: 20, copies: 1,   binding: 'staple' },
    thesis: { size: 'a4', color: 'bw',    sides: 'double', pages: 80, copies: 3,   binding: 'spiral' },
    poster: { size: 'a3', color: 'color', sides: 'single', pages: 1,  copies: 2,   binding: 'none' },
    flyer:  { size: 'a4', color: 'color', sides: 'single', pages: 1,  copies: 100, binding: 'none' }
  };

  const state = {
    job: { size: 'a4', color: 'bw', sides: 'double', pages: 40, copies: 3, binding: 'spiral', file: '', fileSize: 0 },
    fileBad: false,
    cart: [], seq: 0,
    delivery: 'standard', payment: 'cod',
    placed: null, errs: {}
  };

  function bulkRate(total) {
    let r = 0;
    for (const b of SHOP.prices.bulk) if (total >= b.min) r = b.off;
    return r;
  }
  function quote(job) {
    const P = SHOP.prices;
    const total = job.pages * job.copies;
    const unit = P.page[job.size][job.color];
    const base = unit * total;
    const dsOff = job.sides === 'double' ? Math.round(base * P.doubleSided) : 0;
    const rate = bulkRate(total);
    const bulkOff = Math.round((base - dsOff) * rate);
    const printing = base - dsOff - bulkOff;
    const binding = P.binding[job.binding] * job.copies;
    const sheets = (job.sides === 'double' ? Math.ceil(job.pages / 2) : job.pages) * job.copies;
    return { total, unit, base, dsOff, rate, bulkOff, printing, binding, subtotal: printing + binding, sheets };
  }
  function deliveryFee(method, subtotal) {
    const P = SHOP.prices;
    if (method === 'standard' && subtotal >= P.freeStandardFrom) return 0;
    return P.delivery[method] || 0;
  }
  function cartTotals() {
    const subtotal = state.cart.reduce((s, it) => s + quote(it.job).subtotal, 0);
    const fee = deliveryFee(state.delivery, subtotal);
    return { subtotal, fee, total: subtotal + fee };
  }

  /* ===== 5. Hiển thị ===== */
  function applyStatic() {
    document.documentElement.lang = lang;
    document.title = t('meta.title');
    $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    $$('[data-i18n-attr]').forEach(el => {
      el.dataset.i18nAttr.split(';').forEach(pair => {
        const i = pair.indexOf(':');
        el.setAttribute(pair.slice(0, i).trim(), t(pair.slice(i + 1).trim()));
      });
    });
    $$('[data-brand]').forEach(el => { el.textContent = SHOP.brand; });
    $('#f-phone').textContent = SHOP.phone;
    $('#f-email').textContent = SHOP.email;
    $('#f-hours').textContent = SHOP.hours;
    $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $$('[data-step]').forEach(b => {
      const what = t(b.dataset.for === 'pages' ? 'f.pages.short' : 'f.copies.short');
      b.setAttribute('aria-label', t(Number(b.dataset.step) < 0 ? 'f.less' : 'f.more', { what }));
    });
  }

  function renderPrices() {
    const P = SHOP.prices;
    const all = [P.page.a4.bw, P.page.a4.color, P.page.a3.bw, P.page.a3.color];
    $('#usp-price').textContent = t('usp.price.v', { price: money(Math.min.apply(null, all)) });
    const svc = {
      docs: t('svc.docs.p', { price: money(P.page.a4.bw) }),
      thesis: t('svc.thesis.p', { price: money(P.binding.spiral) }),
      poster: t('svc.poster.p', { price: money(P.page.a3.color) }),
      flyer: t('svc.flyer.p', { price: money(P.page.a4.color) })
    };
    $$('[data-price]').forEach(el => { el.textContent = svc[el.dataset.price]; });

    const printTbl = h('table', { class: 'tbl' },
      h('caption', null, t('price.print.t')),
      h('thead', null, h('tr', null, h('th', { scope: 'col' }, t('price.col.size')), h('th', { scope: 'col' }, t('opt.bw')), h('th', { scope: 'col' }, t('opt.color')))),
      h('tbody', null, SIZES.map(s => h('tr', null, h('th', { scope: 'row' }, s.name), h('td', null, money(P.page[s.v].bw)), h('td', null, money(P.page[s.v].color))))));
    const bindTbl = h('table', { class: 'tbl' },
      h('caption', null, t('price.bind.t')),
      h('tbody', null, BINDINGS.filter(b => b !== 'none').map(b => h('tr', null, h('th', { scope: 'row' }, t('opt.' + b)), h('td', null, money(P.binding[b]))))));
    const tiers = P.bulk.map(b => t('price.tier', { pct: pct(b.off), min: fmtNum(b.min) })).join(', ');
    const perks = h('div', null,
      h('p', { class: 'cap' }, t('price.perks.t')),
      h('ul', { class: 'perks' },
        h('li', null, t('price.perk.double', { pct: pct(P.doubleSided) })),
        h('li', null, t('price.perk.bulk', { tiers })),
        h('li', null, t('price.perk.pickup')),
        h('li', null, t('price.perk.standard', { price: money(P.delivery.standard), free: money(P.freeStandardFrom) })),
        h('li', null, t('price.perk.express', { price: money(P.delivery.express) }))));
    $('#price-grid').replaceChildren(printTbl, bindTbl, perks);
  }

  function renderChips() {
    const j = state.job, P = SHOP.prices;
    $('#ch-size').replaceChildren(...SIZES.map(s => chip('size', s.v, s.name, s.sub, j.size === s.v)));
    $('#ch-color').replaceChildren(...COLORS.map(c => chip('color', c, t('opt.' + c), t('opt.' + c + '.s'), j.color === c)));
    $('#ch-sides').replaceChildren(...SIDES.map(s => chip('sides', s, t('opt.' + s), s === 'double' ? t('opt.double.s', { pct: pct(P.doubleSided) }) : t('opt.single.s'), j.sides === s)));
    $('#ch-binding').replaceChildren(...BINDINGS.map(b => chip('binding', b, t('opt.' + b), b === 'none' ? t('opt.none.s') : t('opt.bind.s', { price: money(P.binding[b]) }), j.binding === b)));
  }

  function renderForm() {
    $('#pages').value = state.job.pages;
    $('#copies').value = state.job.copies;
    $('#pages').max = SHOP.limits.pages;
    $('#copies').max = SHOP.limits.copies;
    $('#pages-hint').textContent = t('f.max', { max: fmtNum(SHOP.limits.pages) });
    $('#copies-hint').textContent = t('f.max', { max: fmtNum(SHOP.limits.copies) });
    renderFile();
  }

  function renderFile() {
    const j = state.job;
    $('#drop-label').hidden = !!j.file;
    $('#drop-file').hidden = !j.file;
    $('#file-name').textContent = j.file;
    $('#file-size').textContent = j.file ? (j.fileSize >= 1048576 ? (j.fileSize / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(j.fileSize / 1024)) + ' KB') : '';
    const hint = $('#file-hint');
    hint.textContent = state.fileBad ? t('f.file.bad') : t('f.file.demo');
    hint.classList.toggle('bad', state.fileBad);
  }

  function renderQuote() {
    const j = state.job, q = quote(j), P = SHOP.prices;
    $('#slip-spec').textContent = [j.size.toUpperCase(), t('opt.' + j.color), t('opt.' + j.sides)].join(' · ');
    const row = (label, amount, cls) => h('li', { class: 'slip-row' + (cls ? ' ' + cls : '') },
      h('span', { class: 'lbl' }, label), h('span', { class: 'dots', 'aria-hidden': 'true' }), h('span', { class: 'amt' }, amount));
    const lines = [row(t('slip.print', { n: cnt(q.total, 'page'), unit: money(q.unit) }), money(q.base))];
    if (q.dsOff) lines.push(row(t('slip.double', { pct: pct(P.doubleSided) }), money(-q.dsOff), 'neg'));
    if (q.bulkOff) lines.push(row(t('slip.bulk', { pct: pct(q.rate) }), money(-q.bulkOff), 'neg'));
    if (q.binding) lines.push(h('li', { class: 'slip-row' }, h('span', { class: 'lbl' }, t('slip.bind.' + j.binding, { n: j.copies })), h('span', { class: 'dots', 'aria-hidden': 'true' }), h('span', { class: 'amt' }, money(q.binding))));
    lines.push(h('li', { class: 'slip-row info' }, h('span', { class: 'lbl' }, t('slip.sheets', { n: cnt(q.sheets, 'sheet') }))));
    $('#slip-lines').replaceChildren(...lines);
    const next = P.bulk.find(b => q.total < b.min);
    const need = next ? next.min - q.total : 0;
    $('#slip-hint').textContent = next
      ? t('slip.hint.next', { n: fmtNum(need), unit: t('u.page.' + (need === 1 ? '1' : 'n')), pct: pct(next.off) })
      : t('slip.hint.max', { pct: pct(q.rate) });
    $('#slip-total').textContent = money(q.subtotal);
  }

  function renderBadge() {
    const n = state.cart.length, b = $('#badge');
    b.hidden = n === 0;
    b.textContent = n;
    $('#cart-btn').setAttribute('aria-label', t('nav.cart') + (n ? ' (' + n + ')' : ''));
  }

  function jobTitle(job) {
    return [job.size.toUpperCase(), t('opt.' + job.color), t('opt.' + job.sides)].join(' · ');
  }
  function jobDetail(job) {
    const parts = [cnt(job.pages, 'page') + ' × ' + cnt(job.copies, 'copy')];
    if (job.binding !== 'none') parts.push(t('opt.' + job.binding));
    if (job.file) parts.push(t('co.file', { name: job.file }));
    return parts.join(' · ');
  }

  function renderTotals() {
    const P = SHOP.prices, tt = cartTotals();
    $('#f-address').hidden = state.delivery === 'pickup';
    const rows = [
      h('div', { class: 'r' }, h('span', null, t('co.sub')), h('span', null, money(tt.subtotal))),
      h('div', { class: 'r' }, h('span', null, t('co.ship')), h('span', null, tt.fee ? money(tt.fee) : t('co.free'))),
      h('div', { class: 'r total' }, h('span', null, t('co.total')), h('span', null, money(tt.total)))
    ];
    if (state.delivery === 'standard' && tt.subtotal < P.freeStandardFrom) {
      rows.unshift(h('p', { class: 'nudge' }, t('co.free.hint', { amount: money(P.freeStandardFrom - tt.subtotal) })));
    }
    $('#co-sum').replaceChildren(...rows);
  }

  function renderErrors() {
    ['name', 'phone', 'address'].forEach(k => {
      const msg = $('#e-' + k), input = $('#c-' + k), key = state.errs[k];
      msg.hidden = !key;
      msg.textContent = key ? t(key) : '';
      if (key) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    });
  }

  function renderDone() {
    const p = state.placed;
    $('#co-done').replaceChildren(
      h('div', { class: 'tick' }, icon('check')),
      h('h3', null, t('ok.title')),
      h('p', null, t('ok.thanks', { name: p.name })),
      h('dl', { class: 'facts' },
        h('div', null, h('dt', null, t('ok.code')), h('dd', null, p.code)),
        h('div', null, h('dt', null, t('ok.total')), h('dd', null, money(p.total))),
        h('div', null, h('dt', null, t('ok.eta')), h('dd', null, t('ok.eta.' + p.delivery)))),
      h('p', { class: 'note' }, t('ok.note')),
      h('button', { type: 'button', class: 'btn', id: 'co-done-btn' }, t('ok.done')));
  }

  function renderCheckout() {
    const P = SHOP.prices, empty = state.cart.length === 0;
    $('#co-empty').hidden = !empty || !!state.placed;
    $('#co-form').hidden = empty || !!state.placed;
    $('#co-done').hidden = !state.placed;
    if (state.placed) { renderDone(); return; }
    if (empty) return;
    $('#co-items').replaceChildren(...state.cart.map(it => {
      const q = quote(it.job);
      return h('li', { class: 'item' },
        h('span', { class: 't' }, jobTitle(it.job)),
        h('span', { class: 'p' }, money(q.subtotal)),
        h('button', { type: 'button', class: 'icon-btn', 'data-remove': it.id, 'aria-label': t('co.remove') }, icon('x')),
        h('span', { class: 'd' }, jobDetail(it.job)));
    }));
    const dsub = {
      pickup: t('co.d.pickup.s'),
      standard: t('co.d.standard.s', { price: money(P.delivery.standard), free: money(P.freeStandardFrom) }),
      express: t('co.d.express.s', { price: money(P.delivery.express) })
    };
    $('#co-delivery').replaceChildren(...DELIVERY.map(d => chip('delivery', d, t('co.d.' + d), dsub[d], state.delivery === d)));
    $('#co-payment').replaceChildren(...PAYMENT.map(p => chip('payment', p, t('co.p.' + p), '', state.payment === p)));
    renderTotals();
    renderErrors();
  }

  function renderAll() {
    applyStatic();
    renderPrices();
    renderChips();
    renderForm();
    renderQuote();
    renderBadge();
    if ($('#checkout').open) renderCheckout();
  }

  /* ===== 6. Hành vi ===== */
  const dlg = $('#checkout');
  let toastTimer = 0;

  function showToast(msg, actionLabel, action) {
    const el = $('#toast');
    el.replaceChildren(h('span', null, msg));
    if (actionLabel) {
      const b = h('button', { type: 'button' }, actionLabel);
      b.addEventListener('click', () => { el.hidden = true; action(); });
      el.append(b);
    }
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
  }

  function setNum(id, raw) {
    state.job[id] = clampInt(raw, 1, SHOP.limits[id], state.job[id]);
    $('#' + id).value = state.job[id];
    renderQuote();
  }

  function setFile(f) {
    const ok = !!f && /\.(pdf|docx?|pptx?|jpe?g|png)$/i.test(f.name);
    state.fileBad = !!f && !ok;
    state.job.file = ok ? f.name : '';
    state.job.fileSize = ok ? f.size : 0;
    if (!ok) $('#file').value = '';
    renderFile();
  }

  function applyPreset(key) {
    Object.assign(state.job, PRESETS[key]);
    renderChips();
    renderForm();
    renderQuote();
    goTo('quote');
  }

  function addToOrder() {
    state.cart.push({ id: ++state.seq, job: Object.assign({}, state.job) });
    setFile(null);
    renderBadge();
    showToast(t('toast.added'), t('toast.view'), openCheckout);
  }

  function openCheckout() {
    $('#toast').hidden = true;
    renderCheckout();
    if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
    document.documentElement.classList.add('lock');
  }

  // Sự kiện "close" của <dialog> chạy bất đồng bộ nên dọn dẹp được tách ra và gọi cả hai đường (chạy lại an toàn).
  function afterClose() {
    document.documentElement.classList.remove('lock');
    if (state.placed) {
      state.cart = []; state.placed = null; state.errs = {};
      state.delivery = 'standard'; state.payment = 'cod';
      $('#co-form').reset();
      renderBadge();
    }
  }
  function closeCheckout() {
    if (dlg.open) dlg.close();
    afterClose();
  }

  function validate() {
    const errs = {};
    if ($('#c-name').value.trim().length < 2) errs.name = 'err.name';
    if (!/^\+?\d{9,12}$/.test($('#c-phone').value.replace(/[\s.\-()]/g, ''))) errs.phone = 'err.phone';
    if (state.delivery !== 'pickup' && $('#c-address').value.trim().length < 6) errs.address = 'err.address';
    state.errs = errs;
    renderErrors();
    const first = Object.keys(errs)[0];
    if (first) $('#c-' + first).focus();
    return !first;
  }

  function goTo(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView();
  }

  // Giá trị lưu trữ cục bộ chỉ là tiện ích: bọc try/catch vì có thể bị chặn.
  function loadLang() {
    try { const v = localStorage.getItem('printgo-lang'); if (v === 'vi' || v === 'en') return v; } catch (e) { /* bỏ qua */ }
    return 'en';
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem('printgo-lang', l); } catch (e) { /* bỏ qua */ }
    renderAll();
  }

  function bind() {
    $$('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    $('#menu-btn').addEventListener('click', () => {
      const open = $('#nav').classList.toggle('open');
      $('#menu-btn').setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href').slice(1);
      if (!document.getElementById(id)) return;
      e.preventDefault();
      $('#nav').classList.remove('open');
      $('#menu-btn').setAttribute('aria-expanded', 'false');
      goTo(id);
    });
    $$('[data-preset]').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));

    const job = $('#job');
    job.addEventListener('change', e => {
      const el = e.target;
      if (el.type === 'radio') { state.job[el.name] = el.value; renderQuote(); }
      else if (el.id === 'pages' || el.id === 'copies') setNum(el.id, el.value);
    });
    job.addEventListener('input', e => {
      const el = e.target;
      if (el.id === 'pages' || el.id === 'copies') {
        state.job[el.id] = clampInt(el.value, 1, SHOP.limits[el.id], state.job[el.id]);
        renderQuote();
      }
    });
    job.addEventListener('submit', e => e.preventDefault());
    job.addEventListener('click', e => {
      const b = e.target.closest('[data-step]');
      if (b) setNum(b.dataset.for, state.job[b.dataset.for] + Number(b.dataset.step));
    });

    const drop = $('#drop');
    $('#file').addEventListener('change', e => setFile(e.target.files[0] || null));
    $('#file-clear').addEventListener('click', () => { $('#file').value = ''; state.fileBad = false; setFile(null); });
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) setFile(f); });

    $('#add').addEventListener('click', addToOrder);
    $('#cart-btn').addEventListener('click', openCheckout);
    $('#co-close').addEventListener('click', closeCheckout);
    $('#co-empty-btn').addEventListener('click', () => { closeCheckout(); goTo('quote'); });
    dlg.addEventListener('click', e => { if (e.target === dlg) closeCheckout(); });
    dlg.addEventListener('close', afterClose); // phím Esc đóng hộp thoại bằng đường này
    $('#co-items').addEventListener('click', e => {
      const b = e.target.closest('[data-remove]');
      if (!b) return;
      state.cart = state.cart.filter(it => String(it.id) !== b.dataset.remove);
      renderBadge();
      renderCheckout();
    });
    const co = $('#co-form');
    co.addEventListener('change', e => {
      if (e.target.name === 'delivery') { state.delivery = e.target.value; renderTotals(); }
      if (e.target.name === 'payment') state.payment = e.target.value;
    });
    co.addEventListener('submit', e => {
      e.preventDefault();
      if (!validate()) return;
      state.placed = {
        code: '#' + (1000 + Math.floor(Math.random() * 9000)),
        name: $('#c-name').value.trim(),
        delivery: state.delivery,
        total: cartTotals().total
      };
      renderCheckout();
      $('#co-done-btn').focus();
    });
    $('#co-done').addEventListener('click', e => { if (e.target.closest('#co-done-btn')) closeCheckout(); });
  }

  lang = loadLang();
  bind();
  renderAll();

  // Cho kiểm thử trên trình duyệt.
  window.__shop = { SHOP, S, state, quote, setLang };
})();
</script>
</body>
</html>
