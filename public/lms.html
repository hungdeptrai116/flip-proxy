<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LMS ProMax - Luyện thi thông minh</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%88%91%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="vendor/katex/katex.min.css" />
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b;
  --brand:#4f46e5; --brand2:#7c3aed; --ok:#059669; --warn:#d97706; --bad:#dc2626;
  --radius:16px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 25px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{margin:0}
.hidden{display:none !important}

/* ----- bố cục ----- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:260px;flex-shrink:0;background:#0f172a;color:#fff;display:flex;flex-direction:column}
.sidebar-head{padding:16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex-shrink:0}
.sidebar-name{font-weight:700;font-size:14px}
.sidebar-sub{font-size:12px;color:#94a3b8;word-break:break-word}
.sidebar-nav{flex:1;padding:12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;color:#cbd5e1;text-align:left;width:100%;transition:background .15s}
.nav-item:hover{background:#1e293b}
.nav-item.active{background:var(--brand);color:#fff}
.sidebar-foot{padding:12px;border-top:1px solid #1e293b}
.nav-item.danger{color:#fca5a5}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.topbar h1{font-size:19px;font-weight:700}
.content{padding:24px;flex:1}

/* ----- thành phần ----- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.stat-label{font-size:13px;color:var(--muted);margin-bottom:4px}
.stat-value{font-size:30px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(to right,var(--brand),var(--brand2));color:#fff;box-shadow:var(--shadow)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn-blue{background:#2563eb;color:#fff}
.btn-soft{background:#eef2ff;color:var(--brand)}
.btn-ghost{background:#f1f5f9;color:#475569}
.btn-danger-ghost{background:transparent;color:var(--bad)}
.btn-danger-ghost:hover{background:#fef2f2}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.input,.select,.textarea{width:100%;padding:10px 14px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.6;resize:vertical}
.label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted);font-size:13px}
.pill{padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700}
.pill-ok{background:#dcfce7;color:#15803d}
.pill-bad{background:#fee2e2;color:#b91c1c}
.pill-warn{background:#fef3c7;color:#b45309}
.pill-muted{background:#f1f5f9;color:#64748b}
.empty{text-align:center;color:var(--muted);padding:32px 0}

/* ----- đăng nhập ----- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#312e81,#6b21a8,#1e3a8a)}
.login-box{background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);padding:32px;width:100%;max-width:420px}
.login-logo{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:16px}
.tab{padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab.active{background:#fff;color:var(--brand);box-shadow:var(--shadow)}

/* ----- làm bài ----- */
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.qnav button{width:34px;height:34px;border-radius:9px;font-size:12px;font-weight:700;background:#e2e8f0;color:#64748b}
.qnav button.done{background:#d1fae5;color:#047857}
.qnav button.current{background:var(--brand);color:#fff}
.opt{width:100%;text-align:left;padding:14px;border-radius:13px;border:2px solid var(--line);background:#f8fafc;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;transition:border .15s,background .15s}
.opt:hover:not(:disabled){border-color:#a5b4fc}
.opt .key{width:28px;height:28px;flex-shrink:0;border-radius:50%;background:#fff;border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.opt.picked{border-color:var(--brand);background:#eef2ff}
.opt.picked .key{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt.right{border-color:#22c55e;background:#f0fdf4}
.opt.wrong{border-color:#f87171;background:#fef2f2}
.opt.dim{opacity:.55}
.opt-text{flex:1;min-width:0}
.explain{margin-top:16px;padding:14px;border-radius:12px;background:#eff6ff;border-left:4px solid #3b82f6}
.clock{font-family:ui-monospace,monospace;font-size:18px;font-weight:700}
.clock.low{color:var(--bad)}
.math-formula{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.qtext{font-size:17px;font-weight:600;margin-bottom:18px}

/* ----- soạn đề ----- */
.qcard{padding:16px;border:2px solid var(--line);border-radius:14px;background:#f8fafc;margin-bottom:16px}
.qcard.invalid{border-color:#fca5a5;background:#fef2f2}
.opt-edit{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.opt-edit input[type=text]{flex:1}
.qlist{max-height:60vh;overflow-y:auto;padding-right:8px}
.qlist::-webkit-scrollbar{width:6px}
.qlist::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
.exam-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px}
.exam-row:hover{box-shadow:var(--shadow)}
.note{background:#eff6ff;border-radius:13px;padding:16px;font-size:14px;margin-bottom:16px}
.note b{color:#1d4ed8}
.note ul{margin:8px 0 0;padding-left:20px}
.note li{margin-bottom:4px}
.note code{background:#dbeafe;padding:1px 6px;border-radius:5px;font-size:13px}

/* ----- toast + hiệu ứng ----- */
#toast{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:12px;color:#fff;box-shadow:var(--shadow-lg);font-weight:500;animation:slideIn .3s ease-out;max-width:min(90vw,380px)}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
.toast.info{background:#2563eb}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.wrap-narrow{max-width:820px;margin:0 auto}

@media(max-width:768px){
  .app{flex-direction:column;height:auto;min-height:100vh}
  .sidebar{width:100%;flex-direction:row;align-items:center;overflow-x:auto}
  .sidebar-head{border-bottom:none;border-right:1px solid #1e293b}
  .sidebar-nav{flex-direction:row;padding:8px}
  .nav-item{white-space:nowrap;padding:10px 12px}
  .sidebar-foot{border-top:none;padding:8px}
  .content{padding:16px}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
